apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-wrapper-sa
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-wrapper-role
  namespace: hermes
rules:
  # Pod management — create user pods, check status, exec into them
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # PVC management — create per-user persistent volumes
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  # Secret management — update api-keys.json secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-wrapper-rolebinding
  namespace: hermes
subjects:
  - kind: ServiceAccount
    name: hermes-wrapper-sa
    namespace: hermes
roleRef:
  kind: Role
  name: hermes-wrapper-role
  apiGroup: rbac.authorization.k8s.io
